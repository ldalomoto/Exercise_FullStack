version: "3.9"

services:
  redis:
    image: redis:7
    container_name: redis_db
    ports:
      - "6379:6379"

  backend:
    build: ./backEnd
    env_file:
    - ./backEnd/.env
    container_name: backend_app
    ports:
      - "3000:3000"
    depends_on:
      - redis
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: "REDIS"

  frontend:
    build: ./frontEnd
    container_name: frontend_app
    ports:
      - "5173:5173"
    depends_on:
      - backend